spring.application.name=clinivo_backend

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/clinivo
spring.datasource.username=postgres
spring.datasource.password=sesame

# JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Show SQL (dev only)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cloud Port Binding
server.port=${PORT:8080}

# Message Encryption Key (Base64 encoded AES-256 key)
# Generate a key using: KeyGenerator.getInstance("AES").init(256); key.getEncoded()
# Leave empty to auto-generate on startup (not recommended for production)
encryption.key=